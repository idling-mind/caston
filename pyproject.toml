[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caston"
version = "0.1.0"
description = "Self-hosted local-area-network party game console for Android TV and smartphones."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "CastOn Contributors" }
]
keywords = [
    "party-game",
    "game-console",
    "lan-multiplayer",
    "fastapi",
    "websockets",
    "android-tv",
    "airconsole",
    "jackbox"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/najeem/caston"
Repository = "https://github.com/najeem/caston"

[project.scripts]
caston = "caston.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["caston"]

[tool.hatch.build.targets.sdist]
include = [
    "/caston",
    "/README.md",
    "/AGENTS.md",
    "/requirements.txt",
]

